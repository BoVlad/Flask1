<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конвертер одиниць</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<!--    <link rel="stylesheet" href="style.css">-->
<!--    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">-->
<!--    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>-->
</head>
<body>
    <div class="container">
        <h2>Конвертер одиниць</h2>
        <form method="post">
            <input type="number" name="value" placeholder="Введи число" required step="any">
            <select name="from_unit">
                <option value="cm">Сантиметри</option>
                <option value="m">Метри</option>
                <option value="km">Кілометри</option>
                <option value="inch">Дюйми</option>
                <option value="foot">Фути</option>
            </select>

            <select name="to_unit">
                <option value="cm">Сантиметри</option>
                <option value="m">Метри</option>
                <option value="km">Кілометри</option>
                <option value="inch">Дюйми</option>
                <option value="foot">Фути</option>
            </select>

            <script>
                console.log("Hello World")
                localStorage.setItem("name", "Kostya")
                let name = localStorage.getItem("name")
                localStorage.removeItem("name")
            </script>

            <button type="submit">Конвертувати</button>
        </form>
        {% if result is not none %}
            <h3>Результат: {{ result }}</h3>
        {% endif %}
    </div>
    <div class="container">
<!--        <button type="submit">Більш інфо про одиниці виміру</button>-->
    </div>
</body>
</html>
