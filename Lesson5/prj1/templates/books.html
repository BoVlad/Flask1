<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body>
    <h1>Наші книги</h1>
    <div class="row align-items-center">
        {% for item in books %}
            <div class="col d-flex justify-content-center">
                <div class="card" style="width: 18rem;">
                    <img src="https://store.ukrainer.net/wp-content/uploads/2023/11/free_book_mockup_3-scaled.jpg" class="card-img-top" alt="...">
                    <div class="card-body">
                        <h5 class="card-title">{{ item }}</h5>
                        <p class="card-text">Інформація про книгу</p>
                        <a href="#" class="btn btn-primary">Придбати</a>
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
</body>
</html>
