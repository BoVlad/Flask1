<!doctype html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Сторінка рецептів</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="p-4">
    <div class="container">
        <h1 class="mb-4">Сторінка рецептів</h1>

        <form action="/result" method="POST">
            <div class="mb-3">
                <label for="type" class="form-label">Тип страви</label>
                <select id="type" name="type" class="form-select" required>
                    <option value="" selected disabled>Оберіть тип страви</option>
                    <option value="сніданок">Сніданок</option>
                    <option value="обід">Обід</option>
                    <option value="вечеря">Вечеря</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="difficulty" class="form-label">Складність страви</label>
                <select id="difficulty" name="difficulty" class="form-select" required>
                    <option value="" selected disabled>Оберіть складність</option>
                    <option value="легка">Легка</option>
                    <option value="середня">Середня</option>
                    <option value="складна">Складна</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Показати рецепти
            </button>
        </form>
    </div>
</body>
</html>
